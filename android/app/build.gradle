plugins { id 'com.android.application' }
android {
    namespace 'in.proxyproof.app'
    compileSdk 35
    defaultConfig { applicationId 'in.proxyproof.app'; minSdk 27; targetSdk 35; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.demo' }; release { minifyEnabled false } }
}
