name: Render ProxyProof app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-app.yml'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app in Android emulator and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant in.proxyproof.app.demo android.permission.BLUETOOTH_SCAN || true
            adb shell pm grant in.proxyproof.app.demo android.permission.BLUETOOTH_ADVERTISE || true
            adb shell pm grant in.proxyproof.app.demo android.permission.BLUETOOTH_CONNECT || true
            adb shell pm grant in.proxyproof.app.demo android.permission.ACCESS_FINE_LOCATION || true
            adb shell monkey -p in.proxyproof.app.demo -c android.intent.category.LAUNCHER 1
            sleep 7
            adb exec-out screencap -p > proxyproof-render.png

      - name: Upload rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ProxyProof-render
          path: proxyproof-render.png
